name: linting, testing, building

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Нужен для «update screen-test snapshots»: тот workflow пушит эталоны от
  # имени бота через GITHUB_TOKEN, а такой push GitHub намеренно не считает
  # событием push (защита от рекурсии). workflow_dispatch и repository_dispatch —
  # документированные исключения из этой защиты, поэтому по завершении он сам
  # дёргает этот пайплайн. Руками запускать больше не нужно.
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # Браузер и шрифты уже внутри образа, поэтому шага `playwright install` нет.
    # Тег обязан совпадать с версией playwright в yarn.lock: образ фиксирует
    # сборку Chromium, а от неё зависят эталоны скриншотов. Обновляешь
    # playwright — обновляй тег и перегенерируй baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    strategy:
      matrix:
        node-version: [24.17.0]

    steps:
      - uses: actions/checkout@v4

      - name: Starting Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install modules
        run: yarn install --frozen-lockfile

      # Сверяет тег образа в обоих workflow с версией playwright из
      # node_modules. Разъехались — падаем сразу с внятным сообщением, а не
      # через полтора шага на пиксельных дельтах, не связанных с кодом.
      - name: Assert playwright image matches lockfile
        run: node scripts/assert-playwright-image.mjs

      - name: Linting TypeScript
        run: yarn lint:ts

      - name: Linting CSS
        run: yarn lint:scss

      - name: Unit testing
        run: yarn test:unit

      - name: Build Storybook
        run: yarn build:sb

      - name: Screenshot testing
        run: yarn test:ui:ci

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            screen-tests/diffs
            screen-tests/current
          retention-days: 7

      - name: Build production project
        run: yarn build:prod
