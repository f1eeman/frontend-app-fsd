name: update screen-test snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate snapshots on
        required: true
        default: main

permissions:
  contents: write
  # Нужно, чтобы по завершении дёрнуть main.yml через workflow_dispatch.
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    # Тот же образ, что и в main.yml: baseline должен сниматься ровно в том
    # окружении, в котором его потом проверяет CI.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    strategy:
      matrix:
        node-version: [24.17.0]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Starting Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install modules
        run: yarn install --frozen-lockfile

      # Особенно важно здесь: эталоны, снятые образом не той версии, отравят
      # репозиторий, и CI начнёт падать уже на них.
      - name: Assert playwright image matches lockfile
        run: node scripts/assert-playwright-image.mjs

      - name: Build Storybook
        run: yarn build:sb

      - name: Regenerate snapshots
        run: yarn test:ui:ok:ci

      - name: Commit and push updated snapshots
        id: commit
        # Ветка приходит из инпута, то есть это недоверенный текст. Подстановка
        # ${{ }} прямо в команду означала бы выполнение чего угодно из значения
        # инпута в job-е с contents: write и токеном, поэтому передаём через env.
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # Внутри контейнера workspace принадлежит другому uid, без этого
          # git отказывается работать с "dubious ownership"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Новые стори дают untracked файлы, изменённые — dirty tracked,
          # поэтому смотрим и то и другое.
          git add screen-tests/snapshots

          if git diff --cached --quiet -- screen-tests/snapshots; then
            echo "No snapshot changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(snapshots): regenerate screen-test baselines on Linux"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Push от имени GITHUB_TOKEN не считается событием push, поэтому пайплайн
  # запускаем явно. Отдельный job без контейнера: в образе playwright нет gh,
  # а на голом ubuntu-latest он предустановлен.
  dispatch:
    needs: regenerate
    if: needs.regenerate.outputs.pushed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Run main pipeline on updated baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
        run: gh workflow run main.yml --repo "$REPO" --ref "$BRANCH"
